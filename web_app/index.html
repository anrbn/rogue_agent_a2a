<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Northstar — Trading Demo</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#e8edf7;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{height:72px;border-bottom:1px solid #263047;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand span{color:#72e1b3}.badge{font-size:12px;color:#8fe3bd;border:1px solid #29634d;background:#14372d;padding:7px 10px;border-radius:99px}main{max-width:1280px;margin:38px auto;padding:0 22px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}h1{font-size:30px;margin:0 0 7px}p{color:#97a4bb;margin:0}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:20px}.card{background:#151d30;border:1px solid #27344b;border-radius:18px;padding:24px;box-shadow:0 16px 36px #05091520}.label{font-size:12px;color:#91a0b9;text-transform:uppercase;letter-spacing:1.5px}.big{font-size:38px;font-weight:750;margin:10px 0}.green{color:#6ce1ae}.red{color:#ff8294}.muted{color:#91a0b9}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stocks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stock{background:#1b263d;border:1px solid #30405b;color:#e8edf7;border-radius:13px;text-align:left;padding:16px}.stock.active,.stock:hover{border-color:#69d8ab;background:#203b39}.stock strong{font-size:18px}.stock small{display:block;color:#99a7bc;margin:5px 0 14px}.stock .price{font-size:19px;font-weight:700}.stock .change{font-size:12px;margin-top:6px}.section{font-size:18px;margin:28px 0 14px}.holding{padding:15px 0;border-top:1px solid #2a354b}.ticker{width:39px;height:39px;border-radius:10px;background:#273953;display:grid;place-items:center;font-weight:800;color:#a6c9ff}.holding-name{flex:1}.holding-name small{display:block;color:#91a0b9;margin-top:3px}.right{text-align:right}.tabs{display:flex;background:#0f1728;border-radius:10px;padding:4px;margin:22px 0}.tabs button{flex:1;border:0;background:transparent;color:#9aa9be;padding:11px;border-radius:8px}.tabs button.on{background:#293850;color:white}.field{display:block;color:#a5b1c4;font-size:13px;margin:17px 0 8px}input{width:100%;background:#0f1728;border:1px solid #35425a;border-radius:10px;color:white;padding:13px;outline:none}input:focus{border-color:#72e1b3}.summary{border-top:1px solid #2a354b;margin-top:23px;padding-top:17px;display:grid;gap:13px}.trade{width:100%;border:0;border-radius:10px;background:#6cddb0;color:#092117;font-weight:800;padding:15px;margin-top:22px}.trade.sell{background:#f59aaa;color:#2b1016}.notice{min-height:22px;font-size:13px;margin-top:14px;color:#98e5be}.foot{font-size:12px;color:#71819a;margin-top:24px;text-align:center}@media(max-width:850px){.grid{grid-template-columns:1fr}.stocks{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stocks{grid-template-columns:1fr 1fr}.card{padding:17px}.top{align-items:start}.big{font-size:31px}}
  </style>
</head>
<body>
  <header><div class="brand"><span>✦</span> Northstar</div><div class="badge">● PAPER TRADING DEMO</div></header>
  <main>
    <div class="top"><div><h1>Market overview</h1><p>Explore stocks and manage your practice portfolio.</p></div><div class="muted" id="date"></div></div>
    <div class="grid"><div>
      <section class="card"><div class="row"><div><div class="label">Portfolio value</div><div class="big" id="portfolioValue"></div><div class="green" id="performance"></div></div><div style="font-size:52px;color:#53ca9d">↗</div></div><div class="row" style="margin-top:25px"><div><div class="label">Buying power</div><h2 id="cash"></h2></div><div><div class="label">Invested</div><h2 id="invested"></h2></div></div></section>
      <h2 class="section">Watchlist <span class="muted" style="font-size:13px;font-weight:400">· demo prices</span></h2><div class="stocks" id="stocks"></div>
      <section class="card"><div class="row"><h2 style="margin:0">Your holdings</h2><span class="muted" id="holdingCount"></span></div><div id="holdings" style="margin-top:16px"></div></section>
    </div><aside class="card"><div class="label">TRADE TICKET</div><h2 id="selectedName" style="margin:10px 0 3px"></h2><div class="muted" id="selectedSymbol"></div><div class="big" id="selectedPrice" style="margin-top:27px"></div><div class="green" id="selectedChange"></div><div class="tabs"><button id="buyTab" class="on">Buy</button><button id="sellTab">Sell</button></div><label class="field" for="quantity">Shares</label><input id="quantity" type="number" min="1" step="1" value="1"><div class="summary"><div class="row"><span class="muted">Estimated total</span><strong id="total"></strong></div><div class="row"><span class="muted">Available</span><strong id="available"></strong></div></div><button class="trade" id="trade">Buy shares</button><div class="notice" id="notice" role="status"></div><div class="foot">Orders are simulated and never reach a brokerage.</div></aside></div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
